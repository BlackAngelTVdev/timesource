# Construction et publication de l'image sur GitHub Container Registry (ghcr.io).
#
# L'image est poussee avec le GITHUB_TOKEN du workflow : le package est alors
# rattache a ce depot. Comme le depot est public, l'image est publique et se
# tire sans authentification :
#   podman pull ghcr.io/blackangeltvdev/timesource:latest
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  construire-et-pousser:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Activer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nom d'image en minuscules + etiquettes latest et sha du commit.
      - name: Etiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Compiler et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
